<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Game Mastery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a3d62">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; background: #f4f4f4; }
    header { background: #0a3d62; color: white; padding: 20px; font-size: 1.5em; }
    main { padding: 20px; }
    button { padding: 10px 20px; background: #0a3d62; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>Total Game Mastery</header>
  <main>
    <h1>Welcome to TGM ⚽</h1>
    <p>Your journey to mastery starts here.</p>
    <button id="installBtn" hidden>Install App</button>
  </main>
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
      installBtn.hidden = true;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
    });
  </script>
  <script src="service-worker.js"></script>
</body>
</html>
